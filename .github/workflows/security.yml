name: security

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: unit tests
        working-directory: packages/dsh-context-governance
        run: node --test "test/*.test.mjs"

      - name: repo compliance scan (strict, blocker gate)
        run: node scripts/compliance-scan.mjs --strict

      - name: gitleaks (history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # 私有仓库如需 license，由仓库 secret 提供；不写入仓库
