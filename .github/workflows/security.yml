name: security

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # 插件只支持 Windows（junction/路径/锁语义）；单测必须在 Windows 跑
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # GitHub Windows runner 的默认 TEMP 是 8.3 短名（如 C:\Users\RUNNER~1\...），
      # 而插件按 realpath 归一为长名；测试按原始 tmpdir 断言会失败。
      # 这里把测试进程的 TEMP/TMP 指到长路径，使 os.tmpdir() 与 realpath 一致。
      - name: prepare long temp path
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'D:\a\_temp' | Out-Null
      - name: unit tests
        working-directory: packages/dsh-context-governance
        env:
          TEMP: 'D:\a\_temp'
          TMP: 'D:\a\_temp'
        run: node --test "test/*.test.mjs"

  # 扫描在 Linux 跑：gitleaks-action 的 Windows 二进制下载有已知 404 问题
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要历史
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: repo compliance scan (strict, blocker gate)
        run: node scripts/compliance-scan.mjs --strict
      - name: gitleaks (history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # 私有仓库如需 license，由仓库 secret 提供；不写入仓库
