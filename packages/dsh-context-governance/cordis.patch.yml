# dsh-context-governance bundle patch：把插件挂成宿主加载树里的一行。
#
# 安装形态（见 docs/插件安装升级-Runbook.md）：
#   profile package.json 依赖 = "file:D:/DS-PROJECT/DSH插件开发/packages/dsh-context-governance"
#   profile dsh.profile.bundles 追加 "dsh-context-governance"
#   node_modules\@local\dsh-context-governance = junction 到本包
#   不运行 pnpm install / dsh plugin add（会 prune + 搬走 compression redirect）
#
# 注意：config 里的路径是本机 00 工作区的安装配置；换机器/换项目时改这里。
- insert:
    - id: dsh-context-governance
      name: "dsh-context-governance"
      config:
        enabled: true
        projectRoot: "D:/DS-PROJECT/DSH插件开发"
        memoryRoot: "memory/governance"
        project: "DSH插件开发"
        compression:
          enabled: true
          # 留空 = 启动时自动探测宿主版本（asar 的 package.json）
          hostVersion: ""
          # 留空 = 运行时按引擎标记识别 context-zip，版本标 unknown 但继续工作
          backendVersion: ""
        diagnostics:
          # 首次安装/升级验证用；写一行 apply 记录，不写正文
          logFile: "D:/DS-PROJECT/DSH插件开发/logs/governance.log"
